<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>没有这一页 — webooks</title>
<style>
:root{--ink:#0e0c0a;--paper:#f3ead8;--paper-dim:#cfc4ad;
--glow:#ffb44d;--glow-deep:#d97a1a;--line:rgba(255,180,77,.18)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:2rem;background:var(--ink);color:var(--paper);
font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
background-image:radial-gradient(ellipse at 50% 0%,rgba(255,180,77,.07),transparent 60%)}
main{max-width:32rem;width:100%;text-align:center}
.shelf{font-size:3.5rem;line-height:1;letter-spacing:.1em;color:var(--glow-deep);
margin-bottom:1.5rem;user-select:none}
h1{margin:0 0 .75rem;font-size:1.6rem;font-weight:600;letter-spacing:.04em}
p{margin:0 0 .5rem;color:var(--paper-dim);line-height:1.8;font-size:.95rem}
.links{margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--line);
display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
a{color:var(--glow);text-decoration:none;border-bottom:1px solid transparent;
padding-bottom:2px;transition:border-color .2s}
a:hover,a:focus-visible{border-bottom-color:var(--glow)}
</style>
</head>
<body>
<main>
  <div class="shelf" aria-hidden="true">▤ ▥ ▤</div>
  <h1>没有这一页</h1>
  <p>这个地址不在书库里。也许是链接打错了字，也许是这本书被撤下了。</p>
  <nav class="links">
    <a href="/">回书库首页</a>
    <a href="/requests">求书墙</a>
    <a href="/upload">上传一本书</a>
  </nav>
</main>
</body>
</html>
