name: Deploy to Cloudflare

# 两条触发路径：
#   · push 到 main        → 类型检查 + 测试 + 跑迁移 + 部署
#   · 手动 workflow_dispatch → 可以选择只跑检查不部署
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否执行部署（关闭则只跑检查和迁移演练）'
        type: boolean
        default: true

# 同一时间只允许一个部署，避免并发写 D1
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    outputs:
      deploy_ready: ${{ steps.secrets_check.outputs.deploy_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单元与端到端测试
        run: npm test
      - name: 预算模型自检
        run: npm run budget

      # 没配密钥时（新 fork、刚 clone 的仓库）不应该让 CI 变红，
      # 而是明确跳过部署并给出提示。
      - name: 检查部署密钥是否已配置
        id: secrets_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "deploy_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过部署::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID。配置方法见 docs/DEPLOY.md 的「路径 B」。"
          fi

  deploy:
    name: 部署到 Cloudflare
    needs: verify
    # 三种跳过情况：PR、没配密钥、手动触发时明确关掉了部署。
    # 跳过（skipped）不会让仓库显示红叉，符合预期。
    if: >-
      needs.verify.outputs.deploy_ready == 'true' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # wrangler-action 负责注入 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
      # 并执行 migrations + deploy 两个命令。
      #
      # 注意 D1 的数据库名就是绑定名 "DB"：wrangler 的自动资源创建
      # （wrangler ≥ 4.45）会在首次 deploy 时创建它并把 ID 写回 wrangler.jsonc，
      # 因此这里不需要预先创建任何资源。
      - name: 应用 D1 迁移并部署
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          # 先跑迁移再部署：先有表结构，Worker 上线才能正常服务
          preCommands: npx wrangler d1 migrations apply DB --remote
          command: deploy

      - name: 部署后冒烟测试
        env:
          CF_WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "$CF_WORKER_URL" ]; then
            echo "::warning::未设置仓库变量 WORKER_URL，跳过冒烟测试"
            exit 0
          fi
          echo "探测 $CF_WORKER_URL/dav/"
          curl -sS -o /dev/null -w 'OPTIONS  -> %{http_code}\n' -X OPTIONS "$CF_WORKER_URL/dav/"
          curl -sS -o /dev/null -w 'PROPFIND -> %{http_code}\n' -X PROPFIND -H 'Depth: 1' "$CF_WORKER_URL/dav/"
          echo "完整探针（失败不会让 CI 变红，先把结果打出来给人看）："
          node scripts/dav-probe.mjs --url "$CF_WORKER_URL/dav/" || true
