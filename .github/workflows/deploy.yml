# Deploy to Cloudflare —— GitHub Actions 方案
#
# 为什么用 Actions 而不是 Cloudflare Builds：
#   Workers Builds 是付费功能（每月 6000 分钟额度），本账号已被限制：
#   「Your account is blocked from using Workers Builds」
#   所以走 GitHub Actions —— 免费额度对公开仓库无限。
#
# ────────────────────────────────────────────────────────────────────────
# 需要在仓库 Settings → Secrets and variables → Actions 里配 secret：
#
#   CLOUDFLARE_API_TOKEN   权限范围见下方注释
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 控制台右侧栏可见
#   WRITE_TOKEN            可选，但**强烈建议配** —— 见下方说明
#
# API Token 需要的权限（Dashboard → My Profile → API Tokens → Create Token
# → Edit Cloudflare Workers template，再补两项）：
#
#   Account  · Workers Scripts    : Edit    部署 Worker
#   Account  · D1                  : Edit    应用数据库迁移
#   Account  · Workers R2 Storage  : Edit    读写 R2 绑定
#   Account  · Account Settings    : Read    wrangler 需要（读 account_id）
#
# token 绝不能写进仓库或 workflow 文件，只能放 Actions secrets。
#
# WRITE_TOKEN 是站点的 WebDAV 写口令（和 `wrangler secret put WRITE_TOKEN`
# 设的必须是同一个值）。
#
# ⚠️ 它**不是** ADMIN_TOKEN —— 两者是各自独立的密钥。拿管理口令去发 DELETE
#    一样是 401（src/webdav/index.ts:121 在分发层就拦掉了）。
#
# 探针现在会先做一次**口令预检**（拿一个必然不存在的叶子做 DELETE）：
#   404 = 口令有效 → 三条写探针照跑
#   401 = 口令无效 → 三条全部跳过，明确报「凭据配错」而不是「线上是旧代码」
# 为什么需要这一步：之前只看「传没传口令」，于是**传错口令**和**没传口令**
# 在输出上完全一样（都表现为写探针失败）。这个仓库的 CI secret 就填错过一次
# （填成了 admin 口令），探针因此稳定打印
#   `❌ 期望 412（新代码），实际 401` + `结论：线上仍是旧代码`
# 一次完全正确的部署被自己的门卫判成失败，我照着这个结论去线上追了两轮。
#
# 缺口令时那三条探针还会**往真实书库写文件而删不掉**（本库 PUT 匿名可写、
# DELETE 需要口令），所以规矩是「跑了不能收场就不跑」，宁可不测也不留垃圾。
#
# 另外建议配一个仓库变量（Secrets and variables → Actions → Variables）：
#   WORKER_URL = https://你的域名
# 用于部署后的线上验证（见最后一个 job）。
# ────────────────────────────────────────────────────────────────────────

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: '是否执行部署（关闭则只跑检查）'
        type: boolean
        default: true

# 同一时间只允许一个部署，避免并发写 D1
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    outputs:
      deploy_ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元与端到端测试
        # reporter=verbose：失败时输出用例名而不是只给一个统计行。
        # 上次 CI 红了但拿不到日志（logs 接口要 admin 权限），本地又全绿 ——
        # 没有失败摘要就只能瞎猜。verbose 会把失败的断言直接打进 Actions 日志。
        run: npm test -- --reporter=verbose 2>&1 | tail -80
        # tail 会吃掉退出码，用 pipefail 保住
        shell: bash
        env:
          CI: 'true'

      - name: 预算模型自检
        run: npm run budget

      # 上一次 CI 失败、本地全绿且无法复现 —— 高度怀疑是 runner 慢导致的
      # 个别用例超时抖动。允许重试一次再判死刑，代价只是几分钟 CI 时间。
      - name: 测试重试（仅在上一步失败时）
        id: retry
        if: failure()
        run: npm test


      # 没配密钥时不让 CI 变红，而是明确跳过并给出提示。
      - name: 检查部署密钥是否已配置
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过部署::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID。"
            echo "::notice title=查看说明::配置方法见本文件顶部注释。"
          fi

  deploy:
    name: 部署到 Cloudflare
    needs: verify
    # 三种跳过：PR、没配密钥、手动触发时明确关掉了部署。
    # skipped 不会让仓库显示红叉，符合预期。
    if: >-
      needs.verify.outputs.deploy_ready == 'true' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 应用 D1 迁移（必须在部署之前）
        # 顺序：先迁移、后部署。
        #
        # 反过来（deploy && migrate）会出一个真实的故障窗口：
        #   新代码先上线，但 D1 还没有新列（迁移 0006 的 kind_source）
        #   → 代码 SELECT kind_source → "no such column" → 站点返回 503
        #
        # 先迁移则旧代码根本不用那一列，完全不受影响，零窗口期。
        # 代价：migrations apply 要求 database_id 已存在 —— wrangler.jsonc 里
        # 已经写着（b0edfbd4-…），前置条件满足。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: 部署 Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy

  # 部署后验证「线上真的换了版本」—— 不能只看 CI 变绿。
  # 这一步曾被长期忽略：测试全绿、deploy 显示 success，线上却还是旧代码，
  # 而且没有任何地方报错。
  verify-live:
    name: 线上版本验证
    needs: [verify, deploy]
    if: >-
      always() &&
      needs.verify.outputs.deploy_ready == 'true' &&
      github.event_name != 'pull_request' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    # 探针单请求有界（读 12s / 写 20s），但这只是安全带 —— job 级上限是最后一道：
    # 没有它，一次意外挂起会吃满 GitHub 默认的 6 小时，且被 SIGKILL 时
    # 连 annotation 都来不及发。8 条探针串行正常 ≈10s，10 分钟余量充足。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 用行为探针确认线上是新代码
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          # 写探针需要口令。**不传它这三条探针会全部跳过**，于是「线上是不是
          # 新代码」永远拿不到结论 —— 之前就是这样：探针不带口令去测一条
          # 「无口令必须 401」的用例，稳定报假阴性（❌ + 结论：线上仍是旧代码）。
          WRITE_TOKEN: ${{ secrets.WRITE_TOKEN }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::warning::未设置仓库变量 WORKER_URL，跳过线上验证"
            exit 0
          fi
          if [ -z "$WRITE_TOKEN" ]; then
            echo "::error title=未配置 WRITE_TOKEN secret::三条写探针将被跳过 —— 静态层探针照跑，但**写路径（COPY 白名单 / UNLOCK / Overwrite 412）本轮零验证**，而那三条恰恰是唯一能区分新老代码的部分。红线是刻意的：run #62 曾在探针全跳过的情况下拿绿，被读成「线上已验证通过」，实际什么都没验。配法：npx wrangler secret put WRITE_TOKEN（与仓库 secret 同值；它不是 ADMIN_TOKEN）"
            # ⚠️ 这不是失误后的退出 —— 这是门卫拒绝在「半盲」状态下盖章。
            #    静态层探针再绿也只覆盖一半面；红是「验证未完成」的如实计量。
            #    本地手动跑不受影响（那台 shell 里没有这个 env 是常态）。
            exit 1
          fi
          # `--strict` 不可省：不加它时探针即使报 ❌ 也退出 0，
          # 这个 job 就永远不会红 —— 一个不会失败的门卫比没有门卫更糟，
          # 因为它会被读成「线上已验证通过」。test/static-assets.test.ts 守着这行。
          #
          # 边缘传播可能要几十秒（探针自己的失败提示里就列了这一条），
          # 所以失败后等 30 秒重试一次。真回归会两次都红，不会因此漏掉；
          # 只有最后一次的结果决定这个 job 的成败。
          for attempt in 1 2; do
            if node scripts/verify-deploy.mjs --url "$WORKER_URL" --strict; then
              exit 0
            fi
            if [ "$attempt" = 1 ]; then
              echo "::warning::首次探测未通过，30 秒后重试（可能是边缘传播延迟）"
              sleep 30
            fi
          done
          exit 1
